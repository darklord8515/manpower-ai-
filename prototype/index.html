<style>
/* =====================================================================
   Tokens — the only place colours, sizes and durations are defined.
   Mirrors what apps/web/styles/tokens.css will hold.
   ===================================================================== */
:root {
  color-scheme: light;
  --bg: #f5f5f5; --surface: #ffffff; --surface-raised: #ffffff; --surface-sunken: #f0f0f0; --hover: #f0f0f0;
  --border: #e5e5e5; --border-strong: #d4d4d4;
  --text: #1a1a1a; --text-muted: #525252; --text-subtle: #6b6b6b;
  --accent: #b8202e; --accent-hover: #9e1a27; --accent-on: #ffffff; --accent-text: #b8202e; --accent-soft: #fcebed; --focus: #b8202e;
  --success: #15803d;  --success-text: #166534; --success-soft: #dcfce7;
  --warning: #b45309;  --warning-text: #92400e; --warning-soft: #fef3c7;
  --danger: #b91c1c;   --danger-text: #991b1b;  --danger-soft: #fee2e2;
  --info: #1d4ed8;     --info-text: #1e40af;    --info-soft: #dbeafe;
  --chart-strong: #262626; --chart-mid: #a3a3a3; --track: #e5e5e5;
  --hatch: repeating-linear-gradient(135deg, var(--chart-strong) 0 2px, var(--surface) 2px 4px);
  --shadow-pop: 0 1px 2px rgb(28 25 23 / 6%), 0 8px 24px rgb(28 25 23 / 10%);
  --scrim: rgb(12 10 9 / 40%);
  --photo-overlay: linear-gradient(180deg, rgb(12 10 9 / 45%) 0%, rgb(12 10 9 / 78%) 100%);
  --photo-caption: rgb(255 255 255 / 85%);
  --photo-fallback: #292524;
  --on-photo: #fafaf9;
  --sb-bg: #141414; --sb-text: #f5f5f5; --sb-muted: #a3a3a3; --sb-hover: rgb(255 255 255 / 8%); --sb-active: rgb(255 255 255 / 12%); --sb-border: #2a2a2a; --sb-accent: #e5484d;

  --font-sans: 'IBM Plex Sans', system-ui, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --text-xs: 12px; --text-sm: 13px; --text-base: 14px; --text-md: 16px; --text-lg: 20px; --text-xl: 24px; --text-2xl: 30px;
  --w-regular: 400; --w-medium: 500; --w-semibold: 600;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px;
  --radius-control: 6px; --radius-card: 10px; --radius-pill: 999px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 120ms; --dur-base: 180ms; --dur-count: 600ms; --dur-shimmer: 1200ms;
  --sidebar-w: 240px; --sidebar-collapsed: 56px; --topbar-h: 56px; --content-max: 1440px; --sheet-w: 480px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0f0f; --surface: #171717; --surface-raised: #1c1c1c; --surface-sunken: #0b0b0b; --hover: #222222;
  --border: #262626; --border-strong: #363636;
  --text: #f5f5f5; --text-muted: #a3a3a3; --text-subtle: #8a8a8a;
  --accent: #c8283a; --accent-hover: #d93a4b; --accent-on: #ffffff; --accent-text: #ff6b74; --accent-soft: rgb(229 72 77 / 14%); --focus: #ff6b74;
  --success: #4ade80; --success-text: #4ade80; --success-soft: rgb(74 222 128 / 12%);
  --warning: #fbbf24; --warning-text: #fbbf24; --warning-soft: rgb(251 191 36 / 14%);
  --danger: #f87171;  --danger-text: #f87171;  --danger-soft: rgb(248 113 113 / 14%);
  --info: #60a5fa;    --info-text: #60a5fa;    --info-soft: rgb(96 165 250 / 14%);
  --chart-strong: #d4d4d4; --chart-mid: #737373; --track: #262626;
  --shadow-pop: 0 1px 2px rgb(0 0 0 / 40%), 0 12px 32px rgb(0 0 0 / 50%);
  --scrim: rgb(0 0 0 / 55%);
  --sb-bg: #0a0a0a; --sb-border: #222222;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f0f0f; --surface: #171717; --surface-raised: #1c1c1c; --surface-sunken: #0b0b0b; --hover: #222222;
    --border: #262626; --border-strong: #363636;
    --text: #f5f5f5; --text-muted: #a3a3a3; --text-subtle: #8a8a8a;
    --accent: #c8283a; --accent-hover: #d93a4b; --accent-on: #ffffff; --accent-text: #ff6b74; --accent-soft: rgb(229 72 77 / 14%); --focus: #ff6b74;
    --success: #4ade80; --success-text: #4ade80; --success-soft: rgb(74 222 128 / 12%);
    --warning: #fbbf24; --warning-text: #fbbf24; --warning-soft: rgb(251 191 36 / 14%);
    --danger: #f87171;  --danger-text: #f87171;  --danger-soft: rgb(248 113 113 / 14%);
    --info: #60a5fa;    --info-text: #60a5fa;    --info-soft: rgb(96 165 250 / 14%);
    --chart-strong: #d4d4d4; --chart-mid: #737373; --track: #262626;
    --shadow-pop: 0 1px 2px rgb(0 0 0 / 40%), 0 12px 32px rgb(0 0 0 / 50%);
    --scrim: rgb(0 0 0 / 55%);
  --sb-bg: #0a0a0a; --sb-border: #222222;
  }
}

/* ===================================================================== Base */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: var(--text-base); line-height: 20px; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--radius-control); }
/* Headings receive focus only so screen readers announce the new page; no ring needed there. */
h1[tabindex="-1"]:focus, h1[tabindex="-1"]:focus-visible { outline: none; }
.mono { font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); } .subtle { color: var(--text-subtle); }
.nowrap { white-space: nowrap; }
.small { font-size: var(--text-xs); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.i { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.skip { position: absolute; left: var(--s-2); top: -100px; background: var(--surface); padding: var(--s-2) var(--s-3); border: 1px solid var(--border); border-radius: var(--radius-control); z-index: 100; }
.skip:focus { top: var(--s-2); }

/* ===================================================================== Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); height: 32px; padding: 0 var(--s-3); border-radius: var(--radius-control); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: var(--text-sm); font-weight: var(--w-medium); white-space: nowrap; transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:hover { background: var(--hover); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text-muted); }
.btn-ghost:hover { background: var(--hover); color: var(--text); }
.btn-sm { height: 28px; padding: 0 var(--s-2); font-size: var(--text-xs); }
.btn-block { width: 100%; height: 40px; font-size: var(--text-base); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 1px solid transparent; border-radius: var(--radius-control); background: transparent; color: var(--text-muted); position: relative; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.kbd { font-family: var(--font-mono); font-size: 11px; line-height: 16px; padding: 0 var(--s-1); border: 1px solid var(--border-strong); border-radius: 4px; color: var(--text-subtle); background: var(--surface-sunken); }
.tag { display: inline-flex; align-items: center; gap: var(--s-1); height: 20px; padding: 0 var(--s-2); border-radius: var(--radius-pill); border: 1px solid var(--border); font-size: var(--text-xs); font-weight: var(--w-medium); color: var(--text-muted); white-space: nowrap; }
.tag-proto { border-color: var(--border-strong); color: var(--text); background: var(--surface-sunken); }
.chip { display: inline-flex; align-items: center; gap: var(--s-1); height: 22px; padding: 0 var(--s-2); border-radius: var(--radius-control); font-size: var(--text-xs); font-weight: var(--w-medium); white-space: nowrap; transition: background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out); }
.chip .i { width: 14px; height: 14px; }
.chip-success { background: var(--success-soft); color: var(--success-text); }
.chip-warning { background: var(--warning-soft); color: var(--warning-text); }
.chip-danger  { background: var(--danger-soft);  color: var(--danger-text); }
.chip-info    { background: var(--info-soft);    color: var(--info-text); }
.chip-neutral { background: var(--surface-sunken); color: var(--text-muted); }
.field { display: flex; align-items: center; gap: var(--s-2); height: 32px; padding: 0 var(--s-2); border: 1px solid var(--border-strong); border-radius: var(--radius-control); background: var(--surface); color: var(--text-subtle); }
.field input { border: 0; outline: 0; flex: 1; min-width: 0; background: transparent; font-size: var(--text-sm); color: var(--text); }
.field:focus-within { border-color: var(--focus); }
.select, .input { height: 32px; padding: 0 var(--s-2); border: 1px solid var(--border-strong); border-radius: var(--radius-control); background: var(--surface); font-size: var(--text-sm); color: var(--text); min-width: 0; }
.select:focus, .input:focus, textarea:focus { outline: 0; border-color: var(--focus); }
.check { display: inline-flex; align-items: center; gap: var(--s-2); font-size: var(--text-xs); color: var(--text-muted); }
input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent-hover); }
.count-line { font-size: var(--text-xs); color: var(--text-subtle); }
.preview-label { font-size: var(--text-xs); color: var(--text-subtle); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-control); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; height: 28px; padding: 0 var(--s-3); font-size: var(--text-xs); color: var(--text-muted); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--surface-sunken); color: var(--text); font-weight: var(--w-medium); }

/* ===================================================================== Login */
.login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 3fr) minmax(360px, 2fr); background: var(--bg); }
.login-photo { position: relative; min-height: 100vh; overflow: hidden; background: var(--photo-fallback); color: var(--on-photo); }
.login-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.login-photo::after { content: ""; position: absolute; inset: 0; background: var(--photo-overlay); }
.login-brand { position: absolute; z-index: 1; left: var(--s-12); right: var(--s-12); bottom: var(--s-12); }
/* The company logos are all-white artwork, so they take their colour from the page (currentColor). */
.logo { display: block; fill: currentColor; flex: none; }
.login-logo { width: min(380px, 80%); height: auto; color: var(--on-photo); }
.login-product { margin-top: var(--s-4); font-size: var(--text-sm); font-weight: var(--w-semibold); letter-spacing: 0.24em; color: var(--photo-caption); }
.login-tagline { margin-top: var(--s-2); font-size: var(--text-md); color: var(--photo-caption); max-width: 440px; }
.photo-credit { position: absolute; z-index: 1; right: var(--s-4); bottom: var(--s-3); font-size: 11px; color: var(--photo-caption); }
.photo-credit a { color: inherit; }
.login-panel { display: flex; align-items: center; justify-content: center; padding: var(--s-8) var(--s-6); }
.login-form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: var(--s-4); }
.login-form h1 { font-size: var(--text-xl); line-height: 32px; font-weight: var(--w-semibold); }
.form-row { display: flex; flex-direction: column; gap: var(--s-1); }
.form-row label { font-size: var(--text-xs); font-weight: var(--w-medium); color: var(--text-muted); }
.form-row .input, .form-row .select { height: 40px; font-size: var(--text-base); }
.field-error { font-size: var(--text-xs); color: var(--danger-text); }

/* ===================================================================== Shell */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }
.app[data-collapsed="true"] { --sidebar-w: var(--sidebar-collapsed); }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--sb-bg); color: var(--sb-text); overflow: hidden; }
.brand { display: flex; align-items: center; gap: var(--s-2); height: var(--topbar-h); padding: 0 var(--s-4); border-bottom: 1px solid var(--sb-border); }
.brand-mark { width: 28px; height: 32px; color: var(--sb-text); }
.brand-name { font-size: var(--text-sm); font-weight: var(--w-semibold); letter-spacing: 0.04em; white-space: nowrap; }
.nav { position: relative; flex: 1; overflow-y: auto; padding: var(--s-3) var(--s-2); }
.nav-bar { position: absolute; left: 0; top: 0; width: 3px; border-radius: 0 3px 3px 0; background: var(--sb-accent); opacity: 0; pointer-events: none; }
.nav-bar[data-ready] { transition: transform var(--dur-base) var(--ease-out), height var(--dur-base) var(--ease-out), opacity var(--dur-fast); }
.nav-group + .nav-group { margin-top: var(--s-4); }
.nav-label { padding: 0 var(--s-2) var(--s-1); font-size: var(--text-xs); color: var(--sb-muted); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.nav-item { position: relative; display: flex; align-items: center; gap: var(--s-3); width: 100%; height: 32px; padding: 0 var(--s-2); border: 0; border-radius: var(--radius-control); background: transparent; color: var(--sb-muted); font-size: var(--text-sm); font-weight: var(--w-medium); text-align: left; white-space: nowrap; transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
button.nav-item:hover { background: var(--sb-hover); color: var(--sb-text); }
.nav-item[aria-current="page"] { background: var(--sb-active); color: var(--sb-text); }
.nav-item .count { margin-left: auto; font-size: var(--text-xs); color: var(--sb-muted); }
.nav-soon { color: var(--text-subtle); font-weight: var(--w-regular); cursor: default; height: 28px; }
.nav-toggle .chev { margin-left: auto; transition: transform var(--dur-fast) var(--ease-out); }
.nav-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.sidebar-foot { border-top: 1px solid var(--sb-border); padding: var(--s-2); }
.app[data-collapsed="true"] .nav-label, .app[data-collapsed="true"] .nav-text, .app[data-collapsed="true"] .nav-item .count,
.app[data-collapsed="true"] .brand-name, .app[data-collapsed="true"] .nav-coming { display: none; }
.app[data-collapsed="true"] .nav-item { justify-content: center; padding: 0; }
.app[data-collapsed="true"] .brand { justify-content: center; padding: 0; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; height: var(--topbar-h); display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--s-6); background: var(--bg); border-bottom: 1px solid var(--border); }
.title-block { min-width: 0; flex: 1; }
.crumbs { display: flex; align-items: center; gap: var(--s-1); font-size: var(--text-xs); color: var(--text-subtle); white-space: nowrap; }
.page-title { font-size: var(--text-md); font-weight: var(--w-semibold); line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; align-items: center; gap: var(--s-2); }
.search { display: flex; align-items: center; gap: var(--s-2); width: 240px; height: 32px; padding: 0 var(--s-2); border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); color: var(--text-subtle); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: var(--text-sm); color: var(--text); }
.search:focus-within { border-color: var(--focus); }
.role-pill { display: inline-flex; align-items: center; gap: var(--s-2); height: 32px; padding: 0 var(--s-3); border: 1px dashed var(--border-strong); border-radius: var(--radius-pill); background: var(--surface); font-size: var(--text-xs); color: var(--text-muted); white-space: nowrap; }
.role-pill strong { color: var(--text); font-weight: var(--w-medium); }
.badge { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; padding: 0 var(--s-1); border-radius: var(--radius-pill); background: var(--text); color: var(--bg); font-size: 11px; line-height: 16px; font-weight: var(--w-semibold); text-align: center; }
.avatar { width: 32px; height: 32px; border-radius: var(--radius-pill); display: inline-grid; place-items: center; background: var(--surface-sunken); border: 1px solid var(--border); color: var(--text-muted); font-size: var(--text-xs); font-weight: var(--w-semibold); flex: none; }
.avatar-sm { width: 24px; height: 24px; font-size: 11px; }
.content { width: 100%; max-width: var(--content-max); margin: 0 auto; padding: var(--s-6); }
.page-intro { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-3); margin-bottom: var(--s-4); }
.page-intro h1 { font-size: var(--text-xl); line-height: 32px; font-weight: var(--w-semibold); margin-right: var(--s-2); }
.page-intro .spacer { flex: 1; }

/* ===================================================================== Cards, KPI */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); min-width: 0; }
.card-head { display: flex; align-items: flex-start; gap: var(--s-3); padding: var(--s-4) var(--s-5) var(--s-3); }
.card-head h2 { font-size: var(--text-base); font-weight: var(--w-semibold); }
.card-head p { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }
.card-head > .tag, .card-head > .chip, .card-head > .head-right { margin-left: auto; }
.card-body { padding: 0 var(--s-5) var(--s-5); }
.card-foot { padding: var(--s-3) var(--s-5); border-top: 1px solid var(--border); font-size: var(--text-xs); color: var(--text-subtle); }
.kpis { display: grid; gap: var(--s-3); grid-template-columns: repeat(6, minmax(0, 1fr)); margin-bottom: var(--s-4); }

.kpi { padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-1); }
.kpi-label { display: flex; align-items: center; gap: var(--s-2); font-size: var(--text-sm); color: var(--text-muted); white-space: nowrap; }

.kpi-value { display: flex; align-items: baseline; gap: var(--s-2); margin-top: var(--s-1); }
.kpi-value b { font-size: var(--text-xl); line-height: 32px; font-weight: var(--w-semibold); }
.kpi-value .of { font-size: var(--text-sm); color: var(--text-subtle); }
.kpi-trend { display: flex; align-items: center; gap: var(--s-1); font-size: var(--text-xs); color: var(--text-muted); }
.kpi-trend .i { width: 14px; height: 14px; }
.kpi-detail { font-size: var(--text-xs); color: var(--text-muted); margin-top: var(--s-1); }
.sev-counts { display: flex; flex-direction: column; gap: 2px; margin-top: var(--s-1); }
.sev-counts span { display: flex; align-items: center; gap: var(--s-1); font-size: var(--text-xs); color: var(--text-muted); }
.sev-counts b { min-width: 16px; color: var(--text); font-weight: var(--w-semibold); }
.segbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--track); gap: 2px; margin-top: var(--s-2); }
.seg-deployed { background: var(--chart-strong); } .seg-mobilizing { background: var(--hatch); } .seg-available { background: var(--chart-mid); }
.seg-unavailable { background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-strong); }
.track { position: relative; height: 8px; border-radius: 4px; background: var(--track); min-width: 80px; }
.track-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px 0 0 4px; background: var(--chart-strong); transition: width var(--dur-base) var(--ease-out); }
.track-gap { position: absolute; top: 0; bottom: 0; background: var(--danger); }
.track-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--text); }
.track-row { display: grid; grid-template-columns: minmax(80px, 1fr) auto; align-items: center; gap: var(--s-3); }
.track-num { font-size: var(--text-xs); color: var(--text-muted); min-width: 48px; text-align: right; }

/* ===================================================================== Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 0 var(--s-3); height: 44px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }

tbody tr { transition: background-color var(--dur-fast) var(--ease-out); }

tbody tr:last-child td { border-bottom: 0; }
.row-link { display: flex; align-items: center; gap: var(--s-3); border: 0; background: none; padding: 0; text-align: left; color: var(--text); min-width: 0; }
.row-link .name { font-weight: var(--w-medium); overflow: hidden; text-overflow: ellipsis; }
.row-link:hover .name { text-decoration: underline; text-underline-offset: 3px; }
.gap-short { color: var(--danger-text); font-weight: var(--w-medium); }
.cards-mobile { display: none; }

/* ===================================================================== Dashboard blocks */
.secondary { display: grid; gap: var(--s-4); grid-template-columns: minmax(0, 5fr) minmax(0, 4fr) minmax(0, 4fr); margin-top: var(--s-4); }
.stack { display: flex; flex-direction: column; gap: var(--s-4); }
.approvals { list-style: none; margin: 0; padding: 0; }
.approval { padding: var(--s-4) var(--s-5); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: var(--s-2); }
.approval-meta { display: flex; align-items: center; gap: var(--s-2); font-size: var(--text-xs); color: var(--text-muted); }
.approval-meta .due { margin-left: auto; }
.approval-title { font-weight: var(--w-medium); }
.effect { font-size: var(--text-sm); color: var(--text-muted); }
.effect b { color: var(--text); font-weight: var(--w-medium); }
.readiness { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: var(--s-2) var(--s-3); font-size: var(--text-xs); color: var(--text-muted); }
.dots { display: flex; gap: 2px; } .dot { width: 10px; height: 10px; border-radius: 2px; background: var(--chart-strong); }
.dot-out { background: var(--surface); box-shadow: inset 0 0 0 1px var(--warning); }
.risk { display: flex; gap: var(--s-2); align-items: flex-start; font-size: var(--text-xs); color: var(--danger-text); }
.risk .i { width: 14px; height: 14px; margin-top: 3px; }
.approval-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); margin-top: var(--s-1); }
.approval-actions .who { font-size: var(--text-xs); color: var(--text-subtle); margin-right: auto; display: inline-flex; align-items: center; gap: var(--s-1); }
.decided { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); padding: var(--s-3) var(--s-5); border-top: 1px solid var(--border); font-size: var(--text-sm); }
.decided .btn { margin-left: auto; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: var(--s-3); align-items: start; padding: var(--s-3) var(--s-5); border-top: 1px solid var(--border); }
.date-block { text-align: center; border: 1px solid var(--border); border-radius: var(--radius-control); padding: 2px 0; }
.date-block small { display: block; font-size: 11px; color: var(--text-subtle); line-height: 16px; }
.date-block b { display: block; font-size: var(--text-sm); font-weight: var(--w-semibold); line-height: 20px; }
.li-title { font-size: var(--text-sm); font-weight: var(--w-medium); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.li-sub { font-size: var(--text-xs); color: var(--text-muted); }
.stat-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2); margin-top: var(--s-3); }
.stat { border: 1px solid var(--border); border-radius: var(--radius-control); padding: var(--s-2) var(--s-3); }
.stat b { display: block; font-size: var(--text-md); font-weight: var(--w-semibold); }
.stat span { font-size: var(--text-xs); color: var(--text-muted); }
.big { font-size: var(--text-2xl); line-height: 36px; font-weight: var(--w-semibold); }
.footer { margin-top: var(--s-6); padding-top: var(--s-4); border-top: 1px solid var(--border); font-size: var(--text-xs); color: var(--text-subtle); display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-4); }
.empty { padding: var(--s-10) var(--s-6); text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--s-3); }
.empty .icon-wrap { width: 40px; height: 40px; border-radius: var(--radius-card); border: 1px solid var(--border); display: grid; place-items: center; color: var(--text-subtle); }
.empty h2 { font-size: var(--text-md); font-weight: var(--w-semibold); }
.empty p { max-width: 440px; color: var(--text-muted); font-size: var(--text-sm); }
.alert { padding: var(--s-2) var(--s-3); border-radius: var(--radius-control); background: var(--danger-soft); color: var(--danger-text); font-size: var(--text-xs); display: flex; gap: var(--s-2); align-items: flex-start; }
.alert .i { margin-top: 2px; }
.alert-info { background: var(--info-soft); color: var(--info-text); }
.alert-success { background: var(--success-soft); color: var(--success-text); }
.alert-warning { background: var(--warning-soft); color: var(--warning-text); }
.note { font-size: var(--text-xs); color: var(--text-subtle); }

/* ===================================================================== Projects */
.project-grid { display: grid; gap: var(--s-4); grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.project-card { display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-card); background: var(--surface); transition: border-color var(--dur-fast) var(--ease-out); }
.project-card:hover { border-color: var(--border-strong); }
.photo { position: relative; aspect-ratio: 16 / 9; background: var(--photo-fallback); overflow: hidden; max-width: 100%; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .credit { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--s-4) var(--s-2) var(--s-1); font-size: 11px; color: var(--photo-caption); background: linear-gradient(180deg, transparent, rgb(12 10 9 / 70%)); }
.project-body { padding: var(--s-3) var(--s-4) var(--s-4); display: flex; flex-direction: column; gap: var(--s-2); }
.project-body h3 { font-size: var(--text-base); font-weight: var(--w-semibold); }
.sheet-photo { aspect-ratio: auto; height: 160px; }

/* ===================================================================== Allocation Board */
.queue { margin-bottom: var(--s-4); }
.queue-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-3); padding: var(--s-3) var(--s-4) 0; }
.queue-head h2 { font-size: var(--text-base); font-weight: var(--w-semibold); }
.queue-head .field { flex: 1 1 200px; max-width: 320px; }
.queue-list { list-style: none; margin: 0; padding: var(--s-3) var(--s-4) var(--s-4); display: flex; gap: var(--s-2); overflow-x: auto; }
.req { width: 248px; flex: none; text-align: left; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); padding: var(--s-2) var(--s-3); display: flex; flex-direction: column; gap: 2px; }
.req:hover { background: var(--hover); }
.req[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent-hover); }
.req-top { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); }
.req-name { font-size: var(--text-sm); font-weight: var(--w-medium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.req-meta { font-size: var(--text-xs); color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.minibar { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; margin-top: var(--s-1); }
.minibar span { display: block; height: 100%; background: var(--chart-strong); transition: width var(--dur-base) var(--ease-out); }
.board-main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--s-4); align-items: start; }
.pool-pane { position: sticky; top: calc(var(--topbar-h) + var(--s-4)); max-height: calc(100vh - var(--topbar-h) - var(--s-8)); display: flex; flex-direction: column; }
.pool-pane .pane-scroll { flex: 1; min-height: 0; overflow-y: auto; }
.pane { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); min-width: 0; }
.pane-head { padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: var(--s-2); }
.pane-title { display: flex; align-items: center; gap: var(--s-2); }
.pane-title h2 { font-size: var(--text-base); font-weight: var(--w-semibold); }
.pane-title .count-line { margin-left: auto; }
.filters { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.filters > .select { flex: 1 1 120px; }
.checks { display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-4); }
.detail-head { padding: var(--s-3) var(--s-5); border-bottom: 1px solid var(--border); }
.detail-head h2 { font-size: var(--text-md); line-height: 24px; font-weight: var(--w-semibold); }
.detail-title { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); }
.facts-inline { display: flex; flex-wrap: wrap; gap: 2px var(--s-4); margin-top: var(--s-1); font-size: var(--text-xs); color: var(--text-muted); }
.facts-inline b { color: var(--text); font-weight: var(--w-medium); }
.line + .line { border-top: 1px solid var(--border); }
.line-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-3); padding: var(--s-3) var(--s-5) var(--s-2); }
.line-head h3 { font-size: var(--text-md); font-weight: var(--w-semibold); }
.line-head .fill { font-size: var(--text-xs); color: var(--text-muted); }
.line-head .line-actions { margin-left: auto; display: flex; gap: var(--s-2); }
.line-help { padding: 0 var(--s-5); font-size: var(--text-xs); color: var(--text-subtle); }
.callout { margin: 0 var(--s-5) var(--s-2); padding: var(--s-2) var(--s-3); border-radius: var(--radius-control); background: var(--warning-soft); color: var(--warning-text); font-size: var(--text-xs); }
.callout-title { display: flex; align-items: center; gap: var(--s-2); font-weight: var(--w-semibold); }
.callout ul { list-style: none; margin: var(--s-1) 0 0; padding: 0 0 0 22px; display: flex; flex-direction: column; gap: 2px; }
.callout .mono { opacity: 0.85; }
.wtable { table-layout: fixed; }
.wtable th, .wtable td { height: 40px; padding: 0 var(--s-2); font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; }
.wtable th { height: 32px; font-size: var(--text-xs); }
.wtable th:first-child, .wtable td:first-child { padding-left: var(--s-5); }
.wtable th:last-child, .wtable td:last-child { padding-right: var(--s-5); }
.wtable .w-name b { font-weight: var(--w-medium); }
.wtable .w-reason { color: var(--text-muted); font-size: var(--text-xs); }
.wtable .w-reason .i { vertical-align: -2px; margin-right: 2px; }
.wtable tr[data-swapping="true"] { background: var(--accent-soft); }
.wtable .w-actions { text-align: right; }
.open-slots td { color: var(--text-subtle); font-size: var(--text-xs); border-bottom: 1px dashed var(--border-strong); }
.line-extra { padding: var(--s-2) var(--s-5) 0; display: flex; flex-direction: column; gap: var(--s-2); }
details.sub { font-size: var(--text-xs); color: var(--text-muted); }
details.sub summary { cursor: pointer; padding: var(--s-1) 0; font-weight: var(--w-medium); }
details.sub ul { list-style: none; margin: var(--s-1) 0 0; padding: 0; display: flex; flex-direction: column; gap: var(--s-2); }
details.sub li { display: flex; gap: var(--s-2); align-items: flex-start; justify-content: space-between; }
.bulk { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); padding: var(--s-2) var(--s-3); border-radius: var(--radius-control); background: var(--surface-sunken); font-size: var(--text-xs); }
.inline-form { padding: var(--s-3); border: 1px solid var(--border-strong); border-radius: var(--radius-control); display: flex; flex-direction: column; gap: var(--s-2); background: var(--surface); }
.inline-form label { font-size: var(--text-xs); font-weight: var(--w-medium); }
.inline-form textarea { min-height: 64px; padding: var(--s-2); border: 1px solid var(--border-strong); border-radius: var(--radius-control); background: var(--surface); font-size: var(--text-sm); color: var(--text); resize: vertical; }
.inline-form .row { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; }
.line-foot { padding: var(--s-3) var(--s-5) var(--s-4); }
.errs { list-style: none; margin: var(--s-1) 0 0; padding: 0; display: flex; flex-direction: column; gap: var(--s-1); grid-column: 1 / -1; }
.errs li { display: flex; gap: var(--s-2); align-items: flex-start; font-size: var(--text-xs); color: var(--danger-text); }
.errs .i { margin-top: 2px; } .errs .mono { color: var(--text-subtle); }
.cand-list { list-style: none; margin: 0; padding: var(--s-2); display: flex; flex-direction: column; gap: var(--s-2); }
.cand { border: 1px solid var(--border); border-radius: var(--radius-control); padding: var(--s-2) var(--s-3); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--s-3); align-items: start; }
.cand .chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--s-1); }
.cand-name { font-size: var(--text-sm); font-weight: var(--w-medium); }
.swap-banner { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2) var(--s-3); border-radius: var(--radius-control); background: var(--accent-soft); font-size: var(--text-xs); }
.swap-banner .btn { margin-left: auto; }
.mobile-workers { display: none; }

/* Agent trace */
.trace-box { border: 1px solid var(--border); border-radius: var(--radius-control); font-size: var(--text-xs); color: var(--text-muted); }
.trace-box summary { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2) var(--s-3); cursor: pointer; list-style: none; }
.trace-box summary::-webkit-details-marker { display: none; }
.trace-box summary .chev { transition: transform var(--dur-fast) var(--ease-out); }
.trace-box[open] summary .chev { transform: rotate(90deg); }
.steps { list-style: none; margin: 0; padding: 0 var(--s-3) var(--s-3); display: flex; flex-direction: column; gap: var(--s-2); }
.step { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: var(--s-2); animation: step-in var(--dur-base) var(--ease-out) both; }
.step-dot { width: 20px; height: 20px; border-radius: var(--radius-pill); display: grid; place-items: center; background: var(--success-soft); color: var(--success-text); }
.step-dot .i { width: 12px; height: 12px; }
.step-dot.pending { background: var(--surface-sunken); color: var(--text-subtle); }

function computeForecast(start) {
  const h = [FC.end, addDays(start, FC.docHorizonDays)].sort()[0];
  const mustFinish = addDays(start, -FC.bufferDays);
  return {
    start, horizon: h, mustFinish,
    rows: FC.needs.map(([trade, needed]) => {
      const reserved = state.fc.reserved[trade] || [];
      const sources = new Map(); const excluded = [];
      FC_WORKERS.filter((w) => w.trade === trade && !reserved.includes(w.code)).forEach((w) => {
        const ends = w.endsKey ? state.fc[w.endsKey] : w.ends;
        let why = null;
        if (w.reservedFor) why = ['Already held', `held for ${w.reservedFor}`];
        else if (ends && ends > mustFinish) why = ['Not enough time to move', `${w.project} assignment ends ${fmtDate(ends)}, after ${fmtDate(mustFinish)}`];
        else if (w.leave && w.leave[0] < h && w.leave[1] >= start) why = ['On leave', `approved leave ${fmtShort(w.leave[0])} – ${fmtDate(w.leave[1])}`];
        else if (w.docsUntil < h) why = ['Documents', `${w.docIssue}, before ${fmtDate(h)}`];
        if (why) { excluded.push({ w, kind: why[0], detail: why[1] }); return; }
        const key = w.project || 'now';
        if (!sources.has(key)) sources.set(key, { key, project: w.project || null, ends, workers: [], dependsBy: w.project ? mustFinish : null });
        sources.get(key).workers.push(w);
      });
      const src = [...sources.values()].sort((a, b) => (a.project ? 1 : 0) - (b.project ? 1 : 0));
      const deployable = src.reduce((t, s) => t + s.workers.length, 0);
      const assigned = reserved.length;
      const gap = Math.max(needed - assigned - deployable, 0);
      const pending = state.fc.recruit.filter((r) => r.trade === trade).reduce((t, r) => t + r.headcount, 0);
      return { trade, needed, assigned, deployable, gap, pending, uncovered: Math.max(gap - pending, 0), sources: src, excluded };
    }),
  };
}

function kpiTile({ id, icon: ic, label, value, of, trend, detail, extra, fmt }) {
  const prev = state.kpiShown[id];
  return `<section class="card kpi" aria-label="${esc(label)}">
    <div class="kpi-label">${icon(ic)}${esc(label)}</div>
    <div class="kpi-value"><b data-count="${value}" data-from="${prev === undefined ? 0 : prev}" data-fmt="${fmt || 'int'}" data-kpi="${id}">${fmt === 'pct' ? fmtPct(value) : fmtInt(value)}</b>${of ? `<span class="of">${esc(of)}</span>` : ''}</div>
    ${trend ? `<div class="kpi-trend">${icon('trend', 14)}${esc(trend)}</div>` : ''}
    ${extra || ''}
    <div class="kpi-detail">${detail}</div>
  </section>`;
}
function countUp() {
  const els = [...document.querySelectorAll('[data-count]')].filter((el) => Number(el.dataset.from) !== Number(el.dataset.count));
  els.forEach((el) => { state.kpiShown[el.dataset.kpi] = Number(el.dataset.count); });
  if (reducedMotion() || !els.length) return;
  const dur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--dur-count'), 10) || 600;
  const show = (el, v) => { el.textContent = el.dataset.fmt === 'pct' ? fmtPct(v) : fmtInt(Math.round(v)); };
  els.forEach((el) => show(el, Number(el.dataset.from)));
  const start = performance.now();
  let done = false;
  const step = (now) => {
    if (done) return;
    const k = Math.min((now - start) / dur, 1); const e = 1 - Math.pow(1 - k, 3);
    els.forEach((el) => { const a = Number(el.dataset.from); const b = Number(el.dataset.count); show(el, a + (b - a) * e); });
    if (k < 1) requestAnimationFrame(step); else done = true;
  };
  requestAnimationFrame(step);
  // Animation frames pause in background tabs; never leave a number half-counted.
  setTimeout(() => { done = true; els.forEach((el) => show(el, Number(el.dataset.count))); }, dur + 100);
}

function explainForecast() {
  const fc = computeForecast(state.fc.start);
  const line = (r) => `${r.trade}: ${r.needed} needed, ${r.assigned} held, ${r.deployable} free to assign${r.pending ? `, ${r.pending} being hired` : ''}${r.uncovered ? `, ${r.uncovered} still short` : ', covered'}.`;
  const deps = fc.rows.flatMap((r) => r.sources.filter((s) => s.project).map((s) => `${s.workers.length} ${r.trade.toLowerCase()}${s.workers.length === 1 ? '' : 's'} depend on ${s.project} finishing by ${fmtDate(s.dependsBy)}`));
  const steps = [
    { t: 'Looked at the forecast', d: `RAK-07 on ${fmtDate(fc.start)}. All numbers come from the system.` },
    ...fc.rows.map((r) => ({ t: r.trade, d: line(r) + (r.excluded.length ? ` Not available: ${r.excluded.map((x) => x.kind.toLowerCase()).join(', ')}.` : '') })),
    { t: 'Dependencies', d: deps.length ? `${deps.join('; ')}.` : 'None.' },
    { t: 'Suggested next steps', d: fc.rows.filter((r) => r.uncovered).map((r) => `ask recruitment to hire ${r.uncovered} ${r.trade.toLowerCase()}${r.uncovered === 1 ? '' : 's'}`).concat(fc.rows.filter((r) => r.deployable && r.needed > r.assigned).map((r) => `hold the free ${r.trade.toLowerCase()}s`)).join('; ') || 'Nothing to do.' },
  ];
  state.fc.explain = { steps, shown: 0, running: true };
  const tick = () => { if (!state.fc.explain) return; state.fc.explain.shown++; if (state.fc.explain.shown >= steps.length) state.fc.explain.running = false; if (state.page === 'forecast') renderForecast(); if (state.fc.explain.running) setTimeout(tick, 380); };
  if (reducedMotion()) { state.fc.explain.shown = steps.length; state.fc.explain.running = false; renderForecast(); } else { renderForecast(); setTimeout(tick, 380); }
}

    if (!codes.length) { f.formError = 'Select at least one worker to reserve.'; return rerenderKeepFocus('[data-fc-sel]'), true; }
    if (r.assigned + codes.length > r.needed) { f.formError = `RAK-07 needs ${r.needed - r.assigned} more ${trade.toLowerCase()}s; you selected ${codes.length}.`; return rerenderKeepFocus('[data-fc-sel]'), true; }
    if (!t._ok) return askConfirm(t, { title: `Hold ${codes.length} ${trade.toLowerCase()}${codes.length === 1 ? '' : 's'} for RAK-07?`, happens: [`${codes.length} ${codes.length === 1 ? 'person is' : 'people are'} held for RAK-07 from ${fmtDate(f.start)}.`, 'A request is created, their placement is planned and draft mobilization is prepared.'], told: 'Nobody is messaged yet. The held workers show on the Requests screen.', undo: 'Yes. You can release them later from the Forecast or from a to-do.', verb: `Hold ${codes.length} ${codes.length === 1 ? 'person' : 'people'}`, cancelFirst: true }), true;
    const sr = `SR-2026-${String(state.nextSr++).padStart(4, '0')}`;
    const fromProjects = [...new Set(codes.map((c) => FC_WORKERS.find((w) => w.code === c).project).filter(Boolean))];
    f.reserved[trade] = (f.reserved[trade] || []).concat(codes);
    const lineId = `${sr}-1`;
    REQUESTS.push({ no: sr, project: 'RAK-07', projectName: 'Shamal Logistics Hub', site: 'Site 1, outdoor', from: f.start, until: null, priority: 3, status: 'filled', raisedBy: me(), raised: TODAY,
      lines: [{ id: lineId, trade, count: codes.length, minLevel: 1, closed: { by: me(), date: TODAY, count: codes.length, mobs: `draft mobilizations, report ${fmtDate(f.start)}`, names: codes.map((c) => [c, FC_WORKERS.find((w) => w.code === c).name]), reservation: true } }] });
    initLine(REQUESTS[REQUESTS.length - 1].lines[0]);
    f.reservations.push({ sr, trade, codes, lineId, dependsOn: fromProjects.join(', ') || null });
    f.form = null; f.formError = '';
    toast(`${codes.length} ${trade.toLowerCase()}${codes.length === 1 ? '' : 's'} held for RAK-07 (${sr}). Their placement is planned and draft mobilization is ready.`, 'check');
    runDetectors('assignment created');
    return rerenderKeepFocus(`[data-fc-expand="${trade}"]`), true;
  }
  if (t.dataset.fcRecruitConfirm) {
    const trade = t.dataset.fcRecruitConfirm;
    const count = Number(document.getElementById('rrCount').value); const by = document.getElementById('rrBy').value; const reason = document.getElementById('rrReason').value.trim();
    f.form = { ...f.form, count, neededBy: by, reason };
    if (!Number.isInteger(count) || count < 1) { f.formError = 'Headcount must be a whole number of at least 1.'; return rerenderKeepFocus('#rrCount'), true; }
    if (!by || by < TODAY) { f.formError = 'Needed-by must be a date from today onwards.'; return rerenderKeepFocus('#rrBy'), true; }
    if (reason.length < 10) { f.formError = `Give a reason of at least 10 characters (${reason.length} so far).`; return rerenderKeepFocus('#rrReason'), true; }
    if (!t._ok) return askConfirm(t, { title: `Ask recruitment to hire ${count} ${trade.toLowerCase()}${count === 1 ? '' : 's'}?`, happens: [`A hiring request goes to recruitment for ${count} by ${fmtDate(by)}.`, 'The forecast counts them as “being hired” until they arrive.'], told: 'The recruitment team.', undo: 'A request that has been sent can’t be withdrawn in this version.', verb: 'Send to recruitment' }), true;
    const no = `RR-2027-${String(state.nextRr++).padStart(4, '0')}`;
    f.recruit.push({ no, trade, headcount: count, neededBy: by, reason, by: me() });
    f.form = null; f.formError = '';
    toast(`${no} raised: ${count} ${trade.toLowerCase()}${count === 1 ? '' : 's'} by ${fmtDate(by)}.`, 'check');
    runDetectors('recruitment request raised');
    return rerenderKeepFocus(`[data-fc-expand="${trade}"]`), true;
  }
  return false;
}
function acClick(t) {
  const f = state.ac;
  if (t.hasAttribute('data-ac-retry')) { f.preview = 'live'; state.ui.preview = 'live'; renderUserMenu(); return rerenderKeepFocus(), true; }
  if (t.hasAttribute('data-ac-reset')) { Object.assign(f, { urgency: 'all', mine: false, showAll: false }); return rerenderKeepFocus('#acUrgency'), true; }
  return false;
}
function setAlertSnooze(a, sn) {
  a.status = 'snoozed'; a.snoozedUntil = snoozeUntil(sn);
  a.history.push({ at: 'Now', text: `Reminder set for ${fmtDateTime(a.snoozedUntil)} — ${me()}` });
}
function alertSheetClick(t) {
  if (t.dataset.alert) { state.alertForm = null; openAlert(t.dataset.alert); return true; }
  if (t.dataset.alertAction) { alertAction(t.dataset.alertAction, t.dataset.alertId); return true; }
  const id = t.dataset.alertTake || t.dataset.alertDismiss || t.dataset.alertDismissConfirm || t.dataset.alertDismissCancel;
  if (!id) return false;
  const a = state.alerts.find((x) => x.id === id);
  const log = (text) => a.history.push({ at: 'Now', text: `${text} — ${me()}` });
  if (t.dataset.alertTake) { a.status = 'in_progress'; a.assignee = me(); log('Took this item'); toast('You’re handling this now. Reminders to others stop while you do.'); }
  else if (t.dataset.alertDismiss) { state.alertForm = { id, type: 'dismiss', draft: '' }; openAlert(id); document.getElementById('dismissReason').focus(); return true; }
  else if (t.dataset.alertDismissCancel) { state.alertForm = null; }
  else if (t.dataset.alertDismissConfirm) {
    const reason = document.getElementById('dismissReason').value.trim();
    if (reason.length < 10) { state.alertForm = { id, type: 'dismiss', draft: reason, error: `Give a reason of at least 10 characters (${reason.length} so far).` }; openAlert(id); document.getElementById('dismissReason').focus(); return true; }
    if (!t._ok) return askConfirm(t, { title: 'Mark this as not a problem?', happens: ['It leaves everyone’s to-do list.', `Your reason is saved: “${reason}”`], told: 'Nobody is messaged. It is written to the history.', undo: 'It comes back by itself if things get worse.', verb: 'Mark as not a problem', cancelFirst: true }), true;
    a.status = 'dismissed'; a.resolution = `Marked as not a problem: ${reason}`; log(`Marked as not a problem: ${reason}`); state.alertForm = null; toast('Marked as not a problem. It comes back only if things get worse.');
  }
  renderNav(); renderBell(); renderPage(); openAlert(id);
  return true;
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-close-sheet]');
  if (!e.target.closest('.pop-anchor')) closePopovers();
  if (!t || t.disabled) return;
  if (t.hasAttribute('data-dialog-ok')) return closeConfirm(true);
  if (t.hasAttribute('data-dialog-cancel')) return closeConfirm(false);
  if (t.id === 'roleBtn') return togglePopover('roleBtn', 'rolePop');
  if (t.id === 'bellBtn') { renderBell(); return togglePopover('bellBtn', 'bellPop'); }
  if (t.id === 'userBtn') return togglePopover('userBtn', 'userPop');
  if (t.id === 'themeBtn') return applyTheme(isDark() ? 'light' : 'dark');
  if (t.id === 'menuBtn') return setDrawer(true);
  if (t.id === 'collapseBtn') {
    const app = document.getElementById('app'); const collapsed = app.dataset.collapsed !== 'true';
    app.dataset.collapsed = String(collapsed); t.setAttribute('aria-expanded', String(!collapsed)); t.setAttribute('aria-label', collapsed ? 'Expand sidebar' : 'Collapse sidebar');
    t.querySelector('.nav-text').textContent = collapsed ? 'Expand' : 'Collapse'; store.set('cq.sidebar', collapsed ? 'collapsed' : 'expanded'); return;
  }
  if (t.dataset.demo) { closePopovers(); return demoTool(t.dataset.demo); }
  if (t.hasAttribute('data-signout')) { state.page = 'login'; closePopovers(); return render(); }
  if (t.dataset.role) return setRole(t.dataset.role);
  if (t.dataset.roleJump) return setRole(t.dataset.roleJump);
  if (t.dataset.themeSet) { applyTheme(t.dataset.themeSet); closePopovers(); return; }
  if (t.dataset.nav) {
    return goto(t.dataset.nav);
  }
  if (t.dataset.goto) return goto(t.dataset.goto, t.dataset.gotoReq);
  if (alertSheetClick(t)) return;
  if (state.page === 'allocation' && boardClick(t)) return;
  if (state.page === 'forecast' && forecastClick(t)) return;
  if (acClick(t)) return;
  if (peopleClick(t)) return;
  if (t.dataset.project) return openProject(t.dataset.project);
  if (t.hasAttribute('data-close-sheet')) return closeSheet();
});

document.addEventListener('submit', (e) => {
  if (e.target.id === 'loginForm') {
    e.preventDefault();
    const role = document.getElementById('loginRole').value; const email = document.getElementById('loginEmail').value.trim(); const pw = document.getElementById('loginPw').value;
    const err = document.getElementById('loginError');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = 'Enter a valid email address.'; err.hidden = false; return document.getElementById('loginEmail').focus(); }
    if (!pw) { err.textContent = 'Enter your password.'; err.hidden = false; return document.getElementById('loginPw').focus(); }
    state.role = role; return setRole(role, true);
  }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'reqSearch') { state.ui.q = el.value; return rerenderBoard(); }
  if (el.id === 'wkSearch') { state.wk.q = el.value; state.wk.shown = 25; return rerenderKeepFocus('#wkSearch'); }
  if (el.id === 'dcSearch') { state.dc.q = el.value; return rerenderKeepFocus('#dcSearch'); }
  if (el.id === 'poolSearch') { state.ui.poolQ = el.value; return rerenderBoard(); }
  if (el.dataset.draft) { const st = state.board[el.dataset.draft]; st.draft = el.value; const c = document.getElementById(`rjc-${el.dataset.draft}`); if (c) c.textContent = `${el.value.trim().length} / 10 characters minimum`; }
  if (el.id === 'dismissReason') { if (state.alertForm) state.alertForm.draft = el.value; const c = document.getElementById('dismissCount'); if (c) c.textContent = `${el.value.trim().length} / 10 characters minimum`; }
});
document.addEventListener('change', (e) => {
  const el = e.target; const ui = state.ui;
  if (el.id === 'loginRole') { document.getElementById('loginEmail').value = ROLES[el.value].email; return; }
  const boardMap = { reqStatus: 'status', reqProject: 'project', poolTrade: 'poolTrade', poolLevel: 'poolLevel' };
  if (boardMap[el.id]) { ui[boardMap[el.id]] = el.value; return rerenderBoard(`#${el.id}`); }
  if (el.id === 'docsOnly' || el.id === 'availOnly') { ui[el.id] = el.checked; return rerenderBoard(`#${el.id}`); }
  if (el.id && el.id.startsWith('rm-')) { const st = state.board[el.id.slice(3)]; if (st) { st.draft = el.value; st.formError = ''; } return; }
  if (el.dataset.select) { const [lineId, code] = el.dataset.select.split('|'); const sel = state.board[lineId].selected; if (el.checked) sel.add(code); else sel.delete(code); return rerenderBoard(`[data-select="${el.dataset.select}"]`); }
  if (el.id === 'wkTrade') { state.wk.trade = el.value; state.wk.shown = 25; return rerenderKeepFocus('#wkTrade'); }
  if (el.id === 'wkProject') { state.wk.project = el.value; state.wk.shown = 25; return rerenderKeepFocus('#wkProject'); }
  if (el.id === 'wkExp') { state.wk.expSoon = el.checked; state.wk.shown = 25; return rerenderKeepFocus('#wkExp'); }
  if (el.id === 'dcType') { state.dc.type = el.value; return rerenderKeepFocus('#dcType'); }
  if (el.id === 'acUrgency') { state.ac.urgency = el.value; return rerenderKeepFocus('#acUrgency'); }
  if (el.id === 'acOwner') { state.ac.mine = el.value === 'mine'; return rerenderKeepFocus('#acOwner'); }
  if (el.id === 'acShowAll') { state.ac.showAll = el.checked; return rerenderKeepFocus('#acShowAll'); }
  if (el.dataset.alertAssign && el.value) { const a = state.alerts.find((x) => x.id === el.dataset.alertAssign); a.assignee = el.value; a.history.push({ at: 'Now', text: `Given to ${el.value} — ${me()}` }); toast(`Given to ${el.value.split(' (')[0]}.`); renderNav(); renderBell(); renderPage(); return openAlert(a.id); }
  if (el.dataset.alertSnooze && el.value) { const a = state.alerts.find((x) => x.id === el.dataset.alertSnooze); setAlertSnooze(a, el.value); toast(`We’ll remind you ${fmtDateTime(a.snoozedUntil)}.`); renderNav(); renderBell(); renderPage(); return openAlert(a.id); }
  if (el.id === 'fcStart') { if (el.value) { state.fc.start = el.value; state.fc.form = null; state.fc.explain = null; } return rerenderKeepFocus('#fcStart'); }
  if (el.id === 'fcMove') { state.fc.rak02Steel = el.checked ? '2027-02-20' : '2027-01-31'; runDetectors('project end date changed'); return rerenderKeepFocus('#fcMove'); }
  if (el.dataset.fcSel) { const sel = state.fc.form.sel; if (el.checked) sel.add(el.dataset.fcSel); else sel.delete(el.dataset.fcSel); state.fc.formError = ''; return rerenderKeepFocus(`[data-fc-sel="${el.dataset.fcSel}"]`); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (closeConfirm(false)) return; if (closePopovers()) return; if (closeSheet()) return;
    if (state.page === 'allocation') {
      if (state.ui.swap) { const s = state.ui.swap; state.ui.swap = null; return rerenderBoard(`[data-swap="${s.line}|${s.code}"]`); }
      const open = Object.entries(state.board).find(([, s]) => s.form); if (open) { open[1].form = null; return rerenderBoard(`#line-${CSS.escape(open[0])} [data-reject-line]`); }
    }
    if (state.page === 'forecast' && state.fc.form) { const tr = state.fc.form.trade; state.fc.form = null; return rerenderKeepFocus(`[data-fc-expand="${tr}"]`); }
    if (document.getElementById('sidebar').dataset.open === 'true') setDrawer(false);
    return;
  }
  if (state.page === 'allocation' && e.target.dataset && e.target.dataset.req && ['ArrowDown', 'ArrowUp', 'ArrowRight', 'ArrowLeft'].includes(e.key)) {
    e.preventDefault(); const items = [...document.querySelectorAll('[data-req]')];
    const next = items[items.indexOf(e.target) + (['ArrowDown', 'ArrowRight'].includes(e.key) ? 1 : -1)];
    if (next) { selectRequest(next.dataset.req); rerenderBoard(`[data-req="${next.dataset.req}"]`); }
    return;
  }
});

applyTheme(store.get('cq.theme') || 'system');
if (store.get('cq.sidebar') === 'collapsed') document.getElementById('collapseBtn').click();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(store.get('cq.theme') || 'system'));
initBoard();
runDetectors('seed run');      // the seed runs the detectors; alerts are never inserted by hand
state.booted = true;
render();
</script>
</body>
</html>
