# Models `make ai-check` tries. Add or remove lines freely: it only asks providers whose key is in
# .env (GROQ_API_KEY, OPENROUTER_API_KEY, HF_TOKEN, ANTHROPIC_API_KEY). Ollama needs none.
# Free-tier model names change often (Groq retired its Llama models on 16 Aug 2026 and OpenRouter
# dropped openai/gpt-oss-120b:free). A name that is gone is reported with the provider's own
# message and the check carries on. Use `make ai-check MODELS="groq:some-model"` to try one.
#
# Privacy: OpenRouter's free endpoints may keep and train on prompts. Keep to the fictional demo
# data on them; real employee data belongs on a paid, no-training provider (see docs/agents.md).
candidates:
  - groq:openai/gpt-oss-20b
  - groq:openai/gpt-oss-120b
  - groq:qwen/qwen3.6-27b
  - openrouter:nvidia/nemotron-3.5-super-vl:free
  - openrouter:openrouter/free
  - openrouter:google/gemma-4-31b-it:free
  - openrouter:deepseek/deepseek-v4-flash:free
