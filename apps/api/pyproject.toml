[project]
name = "constructiq-api"
version = "0.1.0"
description = "CONSTRUCTIQ API: FastAPI service layer, rules engine and agent tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "argon2-cffi>=25.1.0",
    "pyyaml>=6.0.3",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "httpx2>=2.16.0",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fake secrets in tests
"app/seed/data.py" = ["E501"]  # one worker per line keeps the demo data easy to compare
"tests/test_forecast.py" = ["E501"]  # one worker per line, with the date it finishes, reads as a table
"tests/world.py" = ["E501"]  # SQL and one scenario line per person
# These build SQL from fixed fragments (the scope condition, a sort whitelist). User input only ever
# travels as bind parameters, and tests/test_security_queries.py checks hostile input stays inert.
"app/routes/*.py" = ["S608"]
"app/auth/scope.py" = ["S608"]
"app/seed/load.py" = ["S608"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
