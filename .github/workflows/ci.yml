name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # Database tests (migrations equal db/schema.sql, seed counts, auth, scope, masking) run against
    # a real Postgres 16. REQUIRE_DB=1 makes a missing database fail the build instead of skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: constructiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d constructiq"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      REQUIRE_DB: "1"
      DATABASE_URL_DIRECT: postgresql+psycopg://postgres:ci-only@localhost:5432/constructiq
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  web:
    name: Web (eslint, tsc, vitest, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: apps/web/e2e/screenshots
          if-no-files-found: ignore

  compose:
    name: Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-only
          APP_DB_PASSWORD: ci-only
          N8N_DB_PASSWORD: ci-only
          N8N_ENCRYPTION_KEY: ci-only
